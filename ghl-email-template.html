<!-- GHL email SHELL: Cloudbeds pilot outreach. Paste once, never edit again.
     All verbiage is injected from the Cloudflare side via contact custom
     fields; copy lives in outreach-copy.json in this repo. One template, one
     workflow, no branches: segment differences (main vs desk) are baked into
     the field VALUES when the writer runs.
     SUBJECT: set the template's subject field to exactly {{contact.email_subject}}.
     PREVIEW TEXT: {{contact.personal_hook}}.
     Slots: personal_hook (unique per contact), email_body_1 (pitch paragraph,
     per segment), email_body_2 (offer paragraph), email_body_3 (CTA line).
     Greeting, signature, and postal footer are structural and stay static.
     Fill in the [street address] before first send. -->
<!DOCTYPE html>
<html>
<body style="margin:0;padding:0;background:#ffffff;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr><td align="center" style="padding:24px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;">
        <tr><td style="font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;color:#1c2430;padding-bottom:16px;">
          {{contact.email_greeting}}
        </td></tr>
        <tr><td style="font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;color:#1c2430;padding-bottom:16px;">
          {{contact.personal_hook}}
        </td></tr>
        <tr><td style="font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;color:#1c2430;padding-bottom:16px;">
          {{contact.email_body_1}}
        </td></tr>
        <tr><td style="font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;color:#1c2430;padding-bottom:16px;">
          {{contact.email_body_2}}
        </td></tr>
        <tr><td style="font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;color:#1c2430;padding-bottom:24px;">
          {{contact.email_body_3}}
        </td></tr>
        <tr><td style="font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.5;color:#1c2430;padding-bottom:24px;">
          Chris Russo<br>
          Virtual Office AI
        </td></tr>
        <tr><td style="font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#8a94a1;padding-top:8px;">
          Virtual Office AI &middot; 26 1st Street, Pelham, NY 10803
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
